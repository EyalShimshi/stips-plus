name: Announcements

# Checks announcements.json whenever it changes (#41). Every Stips+ from 0.23 reads it, so it must stay valid JSON in
# the shape MAINTAINING.md shows; a mistake fails this check (the GitHub app says so), and the apps keep showing the
# last good file meanwhile. Editing it builds nothing (build.yml ignores it).
on:
  push:
    branches: [main]
    paths: [announcements.json]
  pull_request:
    paths: [announcements.json]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check announcements.json
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check the file
        run: |
          set -euo pipefail
          file=announcements.json
          if [ "$(stat -c %s "$file")" -gt 65536 ]; then echo "::error file=$file::Over 64 KB: the apps don't read it."; exit 1; fi
          jq -e . "$file" > /dev/null || { echo "::error file=$file::This isn't valid JSON (a missing comma or quote?)."; exit 1; }
          jq -e '.announcements | type == "array"' "$file" > /dev/null \
            || { echo "::error file=$file::The file needs {\"announcements\": [ ... ]}."; exit 1; }
          problems="$(jq -r '
            def day: type == "string" and test("^[0-9]{4}-[0-9]{2}-[0-9]{2}$");
            def words: (type == "string" and length > 0) or (type == "object" and ((.he // "") + (.en // "")) != "");
            .announcements | to_entries[] | (.key + 1) as $n | .value |
            (if (.id | type) != "string" or (.id | length) == 0 then "Announcement \($n): it needs an \"id\"." else empty end),
            (if (.text | words) | not then "Announcement \($n): it needs a \"text\"." else empty end),
            (if .link != null and ((.link | type) != "string" or (.link | startswith("https://") | not)) then "Announcement \($n): \"link\" must start with https://" else empty end),
            (if .from != null and (.from | day | not) then "Announcement \($n): \"from\" must look like 2026-12-31." else empty end),
            (if .until != null and (.until | day | not) then "Announcement \($n): \"until\" must look like 2026-12-31." else empty end),
            (if .channel != null and ((.channel as $c | ["all", "release", "test"] | index($c)) == null) then "Announcement \($n): \"channel\" is all, release or test." else empty end)
          ' "$file")"
          repeated="$(jq -r '[.announcements[].id] | group_by(.) | map(select(length > 1) | .[0]) | .[] | "The id \"\(.)\" is used twice."' "$file")"
          if [ -n "$problems$repeated" ]; then
            printf '%s\n%s\n' "$problems" "$repeated" | sed '/^$/d' | while read -r line; do echo "::error file=$file::$line"; done
            exit 1
          fi
          echo "OK: $(jq '.announcements | length' "$file") announcement(s)." | tee -a "$GITHUB_STEP_SUMMARY"
